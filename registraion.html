<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>College Event Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .nav-bar {
      display: flex;
      gap: 16px;
      padding: 12px;
      background-color: #f2f7fa;
    }
    .nav-bar a {
      color: blue;
      font-weight: bold;
    }
    .form-container {
      border: 1px solid rgb(7, 6, 6);
      padding: 15px;
      width: 320px;
      margin-top: 15px;
    }
   
 
    
    input, select {
      width: 100%;
      padding: 6px;
        margin-top: 5px;
    }
    button {
      padding: 6px 12px;
      margin-top: 5px;
      cursor: pointer;
    }
  
  </style>
</head>
<body>

  <nav class="nav-bar" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="events.html">Events</a>
    <a href="registraion.html" aria-current="page">Registration</a>
  </nav>

  <h1 id="mainHeading">Student Event Registration</h1>

  <div id="formSection" class="form-container">
    <div class="form-group">
      <label for="studentName">Student Name:</label>
      <input type="text" id="studentName" placeholder="Enter your full name">
    </div>

    <div class="form-group">
      <label for="rollNumber">Student Roll Number:</label>
      <input type="text" id="rollNumber" placeholder="Enter roll number">
    </div>

    <div class="form-group">
      <label for="studentEmail">Email Address:</label>
      <input type="email" id="studentEmail" placeholder="Enter email address">
    </div>

    

    <button onclick="registerStudent()">Register</button>
  </div>

  
  <p id="message"></p>

  
  <div class="controls">
    <button onclick="changeHeadingSize()">Change Heading Size</button>
    <button onclick="toggleForm()">Show / Hide Form</button>
  </div>

   <script>
    
    function registerStudent() {
      var name = document.getElementById("studentName").value;
    var roll = document.getElementById("rollNumber").value;
      var email = document.getElementById("studentEmail").value;
      var eventName = document.getElementById("eventSelect").value;
      var messageBox = document.getElementById("message");

      
      if (name === "" || roll === "" || email === "" || eventName === "") {
        messageBox.textContent = "Error:  Please fill in all the required fields.";
        messageBox.style.color = "red";
        alert("Please fill in all the required fields.");
      } 
      else 
      {
        messageBox.textContent = "Success! Thank you, " + name + " (Roll No: " + roll + "). You are registered for " + eventName + ".";
        messageBox.style.color = "green";
      }
    }

    var isLarge = false;
    function changeHeadingSize() {
      var heading = document.getElementById("mainHeading");
      if (isLarge) {
        heading.style.fontSize = "24px";
        isLarge = false;
      } else {
        heading.style.fontSize = "36px";
        isLarge = true;
      }
    }

    function toggleForm() {
      var form = document.getElementById("formSection");
      if (form.style.display === "none") {
        form.style.display = "block";
      } else {
        form.style.display = "none";
      }
    }
  </script>

</body>
</html>
